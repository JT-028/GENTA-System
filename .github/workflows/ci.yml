name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  php-lint:
    name: PHP syntax (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Lint application PHP
        run: |
          find GENTA/src GENTA/config GENTA/templates -name '*.php' -print0 \
            | xargs -0 -n1 php -l

  python-compile:
    name: Python compile (IoT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile entrypoints
        run: |
          python -m py_compile \
            GENTA_MAIN_SYSTEM_IoT/config.py \
            GENTA_MAIN_SYSTEM_IoT/config.example.py \
            GENTA_MAIN_SYSTEM_IoT/GENTA_Flask.py
